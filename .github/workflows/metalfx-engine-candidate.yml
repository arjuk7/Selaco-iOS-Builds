name: Selaco v0.200 compatibility candidate
# v0.200 candidate: genuine 4.15.1 API integration; private support stays on device.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metalfx-engine-candidate.yml']

permissions:
  contents: read

concurrency:
  group: selaco-experimental-engine
  cancel-in-progress: false

jobs:
  arm64-iphoneos-savegame-receiver:
    name: full-engine iOS v0.200 compatibility candidate
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[selaco-build38]')
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SELACO_IOS_AUDIO_CANDIDATE: "1"
      SELACO_IOS_SAVES_CANDIDATE: "1"
      SELACO_METALFX_EXPERIMENTAL_BUILD: "1"
      SELACO_V0200_CANDIDATE: "1"
    steps:
      - name: Check out SelacoiOS
        uses: actions/checkout@v4

      - name: Select iOS26 SDK
        run: |
          selected=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$selected"
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version

      - name: Validate persistent engine fatal status
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I overlays/gzselaco-ios tests/engine_probe_status_test.cpp -o "${RUNNER_TEMP}/engine-probe-status-test"
          "${RUNNER_TEMP}/engine-probe-status-test"

      - name: Build v0.200 compatibility candidate
        run: |
          real_mktemp="$(command -v mktemp)"
          shim_dir="${GITHUB_WORKSPACE}/build/m4-title-menu-shims"
          controlled_root="${GITHUB_WORKSPACE}/build/work/m4-title-menu-app/tmp"
          mkdir -p "${shim_dir}" "${controlled_root}"
          cp scripts/m0-controlled-mktemp.sh "${shim_dir}/mktemp"
          chmod +x "${shim_dir}/mktemp"
          export SELACOIOS_REAL_MKTEMP="${real_mktemp}"
          export SELACOIOS_CONTROLLED_TMP_ROOT="${controlled_root}"
          export PATH="${shim_dir}:${PATH}"
          bash scripts/m4-title-menu-app-artifact-probe.sh

      - name: Record workflow identity
        if: always()
        run: |
          mkdir -p build/evidence/m4-title-menu-app
          {
            echo "tested_head=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "stable_bundle_identifier=am.arjunkl.selacoios.engineinit.m4"
            echo "stable_files_container=SelacoiOS Engine Init"
            echo "bundle_version=0.9.7(38)"
            echo "engine_content_version=4.15.1"
            echo "owned_support_device_path=Documents/Selaco/Engine/gzdoom.pk3"
            echo "private_assets_in_ci=false"
            echo "runtime_diagnostic_file=Documents/Selaco/zscript-compile.log"
            echo "diagnostic_scope=v0200_base_compatibility_owned_support_and_persistent_fatal"
            echo "job_id_available_after_run=true"
          } > build/evidence/m4-title-menu-app/workflow-identity.txt

      - name: Preserve M4M upstream API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-v0200-compatibility-evidence
          path: |
            build/evidence/m4-title-menu-app
            build/evidence/m4-title-menu-compile
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve updated Engine Init IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-v0200-compatibility-unsigned-ipa
          path: build/artifacts/m4-title-menu-app/Selaco-engine-init-probe-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
